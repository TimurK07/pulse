name: Deploy Pulse to laptop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-laptop
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, pulse]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      DEMO_MODE: 'true'
      SESSION_COOKIE_SECURE: 'true'
      PULSE_PUBLIC_URL: https://pulse.endfieldhq.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate Docker
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\DockerDesktop\resources\bin'
          if (-not (Test-Path "$bin\docker.exe")) {
            $bin = 'C:\Program Files\Docker\Docker\resources\bin'
          }
          if (-not (Test-Path "$bin\docker.exe")) { throw 'Docker Desktop is missing for the runner user.' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build application
        run: |
          docker compose -p pulse-main build app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy and check health
        run: |
          docker compose -p pulse-main up -d --no-build --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:3000/login' -TimeoutSec 15
          if ($response.StatusCode -ne 200) { throw 'Pulse login health check failed.' }
      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose -p pulse-main ps
          docker compose -p pulse-main logs --tail 80 app
