# Необязательно: PostgreSQL для локального запуска, если он не установлен
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-db:/var/lib/postgresql/data
volumes:
  pulse-db:
